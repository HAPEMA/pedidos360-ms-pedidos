spring.application.name=ms-pedidos
server.port=${PORT:8082}

# Base de datos (RDS PostgreSQL en AWS). Credenciales solo por variables de entorno.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Solo health expuesto: el resto de actuator no se publica.
management.endpoints.web.exposure.include=health

# ms-catalogo (misma instancia EC2, puerto 8081)
catalogo.url=${CATALOGO_URL:http://localhost:8081}

# Cognito: el issuer se arma con el ID del User Pool; nada de IDs en el repo.
# issuer-uri del User Pool: https://cognito-idp.<region>.amazonaws.com/<userPoolId> (sin barra final).
# Se define con COGNITO_ISSUER_URI; si falta, se arma con COGNITO_POOL_ID (compatibilidad con despliegues previos).
app.security.issuer=${COGNITO_ISSUER_URI:https://cognito-idp.us-east-1.amazonaws.com/${COGNITO_POOL_ID}}
app.security.client-id=${COGNITO_CLIENT_ID}

# CORS: origen exacto del front
app.cors.origen=${FRONT_ORIGIN:http://localhost:4200}
