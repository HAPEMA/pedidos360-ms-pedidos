# Perfil local: H2 en memoria y valores por defecto para arrancar sin variables de entorno.
spring.datasource.url=jdbc:h2:mem:pedidos;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

app.security.issuer=https://cognito-idp.us-east-1.amazonaws.com/${COGNITO_POOL_ID:us-east-1_XXXXXXXXX}
app.security.client-id=${COGNITO_CLIENT_ID:sin-cliente}
