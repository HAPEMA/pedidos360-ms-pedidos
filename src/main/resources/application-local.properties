# Perfil local: H2 en memoria (RDS no es accesible desde el PC) y, como valores por defecto,
# el User Pool y el App Client reales de Cognito (no son secretos) para validar tokens reales.
spring.datasource.url=jdbc:h2:mem:pedidos;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

app.security.issuer=${COGNITO_ISSUER_URI:https://cognito-idp.us-east-1.amazonaws.com/${COGNITO_POOL_ID:us-east-1_yJTuOqej9}}
app.security.client-id=${COGNITO_CLIENT_ID:55g18pciai9kmgp5818ta6ur28}
