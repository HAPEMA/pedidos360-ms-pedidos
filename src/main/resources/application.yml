# Mensajería asíncrona (RabbitMQ). Host y credenciales por variables de entorno;
# los defaults son solo para desarrollo local (broker en localhost).
spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10

# Único lugar donde viven los nombres de exchanges, colas y routing keys.
app:
  rabbit:
    exchanges:
      pedidos: adopciones.pedidos   # eventos del ciclo de vida del pedido (topic)
      dlx: adopciones.dlx           # dead-letter exchange compartido (direct)
    # ms-pedidos solo publica: las colas (y sus DLQ) las declaran ms-notificaciones y ms-documentos.
    routing-keys:
      pedido-creado: pedido.creado
      animal-asignado: animal.asignado
      adopcion-confirmada: adopcion.confirmada

# El broker no debe afectar al /actuator/health existente (health check del balanceador):
# sin RabbitMQ el servicio sigue sirviendo HTTP, solo se pausa la mensajería.
management:
  health:
    rabbit:
      enabled: false
